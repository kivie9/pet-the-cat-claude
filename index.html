<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vuốt mèo</title>
<meta name="description" content="Vuốt ve mèo ngay trên trình duyệt. Chọn một bé mèo, rê tay qua bộ lông và tìm chỗ mèo thích được vuốt nhất.">
<meta name="theme-color" content="#1c1713">
<meta property="og:title" content="Vuốt mèo">
<meta property="og:description" content="Chọn một bé mèo, rê tay qua bộ lông và tìm chỗ mèo thích được vuốt nhất.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="scene.js">
<link rel="modulepreload" href="gl.js">
<link rel="modulepreload" href="hand.js">
<link rel="modulepreload" href="audio.js">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas class="scene" id="scene" aria-hidden="true"></canvas>
    <div class="catkey" id="catkey" tabindex="0" role="button" aria-label="Vuốt mèo. Nhấn Enter hoặc Space để vuốt."></div>
    <div class="hand" id="hand" aria-hidden="true"></div>
  </main>

  <header class="top">
    <div class="brand">
      <h1>Vuốt mèo</h1>
      <p class="count" id="count"></p>
    </div>
    <div class="tools">
      <button class="round" id="snd" type="button" aria-label="Âm thanh" aria-pressed="true" title="Bật hoặc tắt âm thanh">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/>
          <path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>
          <path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
    </div>
  </header>

  <footer class="bottom" id="bottom">
    <div class="caption">
      <h2 class="name" id="name"></h2>
      <p class="meta" id="meta"></p>
      <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <p class="say" id="say" role="status" aria-live="polite"></p>
    </div>
    <nav class="dock" id="dock" role="group" aria-label="Chọn mèo"></nav>
  </footer>
</div>
<noscript><p class="nojs">Trang này cần bật JavaScript để vuốt mèo.</p></noscript>
</body>
</html>
