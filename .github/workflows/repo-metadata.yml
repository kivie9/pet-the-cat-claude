name: Sync repo metadata
on:
  push:
    branches: [main]
    paths: ['.github/repo-metadata.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply description, homepage and topics
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          gh repo edit "$GITHUB_REPOSITORY" \
            --description "$(jq -r .description .github/repo-metadata.json)" \
            --homepage "$(jq -r '.homepage // ""' .github/repo-metadata.json)"
          jq '{names: .topics}' .github/repo-metadata.json | \
            gh api -X PUT "repos/$GITHUB_REPOSITORY/topics" --input -
